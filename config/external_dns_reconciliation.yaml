    blockers:
      - External A and PTR resolve to 138.121.100.6; Internal A remains 192.168.25.7. The former .101.3 has no assignment, route, NAT, A, or PTR.
      - Public TCP 80 maps to Node-RED guest port 1880. The effective orchestrator.firmware_base_url is http://iot.intelisis.com.ar/endpoint/firmware, and a capped public firmware GET returned HTTP 200. Node-RED v22.1.0 runs with ssl=false and HTTP-node Basic Auth disabled; endpoint-specific authentication remains enabled.
      - PM_ADMIN_TOKEN, PM_DEVICE_SECRET, and PM_TRACCAR_INGEST_TOKEN are present in the protected runtime secrets file; unauthenticated device-command, admin, and heartbeat probes returned HTTP 401. The heartbeat helper's missing-token bypass is fixed and deployed.
      - Public HTTPS 443 and MQTT TLS 8883 present the renewed production certificate issued October 15, 2026, expiring January 13, 2027. The local Home Assistant app local_iot_certbot_dns is started in production mode with boot mode auto. On October 16, the operator approved a forced production renewal. The app completed DNS-01/RFC2136 issuance, deployed the certificate to /ssl, and successfully requested Home Assistant and Mosquitto restarts. The deployed and served HTTPS/MQTT certificate fingerprints match, hostname and chain checks pass, and HTTPS returns HTTP 200. The External intelisis.com.ar SOA serial is 2026101522 on primary and secondary; public resolvers show no leftover challenge TXT. Keep core_letsencrypt stopped on HTTP-01.
      - On October 16, 2026, the dedicated IoT-admin public key authenticated through both the former .100.6:8922 path and the new .100.6:20073 high-port path. The external firewall owner confirmed the TCP 20073 source policy; the new NAT rule is active and uses the existing iot.intelisis.com.ar hostname, with no DNS change. After high-port acceptance, the public 8922 forward was removed while MQTT TCP 8883 remained enabled. RouterOS source filtering is not planned.
      - Runtime secrets are owner-only; configured Node-RED static-auth password was rotated without changing other add-on options.

