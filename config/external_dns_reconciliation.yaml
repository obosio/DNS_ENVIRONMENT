additional_findings:
  - Verified October 14 on both authorities. aero.com.ar and intelisis.com.ar are apex A records, 10.8.0.21 in Internal and 138.121.100.4 in External; www.aero.com.ar and public.aero.com.ar are CNAMEs to aero.com.ar; lujan.intelisis.com.ar remains 10.8.0.21 Internal and 138.121.100.15 External.
  - Lujan TCP 80/443 NAT for public 138.121.100.4 and internal 10.8.0.21 forwards to running TIC Gestion CT 27020 at 192.168.27.20. No NAT rules were changed during the DNS correction.
  - Approved October 14 retirement: database.intelisis.com.ar has no A record in either forward view, its stale PTR at 138.121.101.4 was removed, and both names return authoritative NXDOMAIN in both views on both authorities. db1.intelisis.com.ar remains active at 192.168.27.25 Internal and 138.121.101.15 External. The old 138.121.101.4 address assignment and resulting /32 route have now also been removed from all audited CORE routers.
  - Approved October 14 retirement: services.aero.com.ar, fileserver.aero.com.ar, owncloud.aero.com.ar, and wiki.aero.com.ar were removed from their applicable Aero view records. All four return authoritative NXDOMAIN in both views on both authorities. The approved names mantis.aero.com.ar and gestion.aero.com.ar also remain NXDOMAIN in both views on both authorities.
  - October 14 CORE/PVE audit and approved cleanup: PMS A records were removed from both polodesalud.com.ar views and its External PTR was removed; PBX External A was removed while its Internal A remains 192.168.26.6. Both changes were validated and replicated to the secondary DNS authority.
  - October 14 router cleanup: 138.121.101.4/32 was removed from the Lujan loopback; its dynamic host route disappeared locally and from TIC, Centro, and Cordoba. No NAT for this address or the deleted Database guest remains on the four CORE routers.
  - October 14 operator disposition: the polodesalud.com.ar A record at 138.121.101.242, www CNAME, and active route through Lujan PPPoE-in session backbone-16 via 192.168.102.194 are correct and are to remain unchanged.
  - The retired mailcow-pilot.intelisis.com.ar name and 138.121.100.8 PTR both return authoritative NXDOMAIN on primary and secondary; the pilot PTR cleanup is verified.
  - polodesalud.com.ar remains A 138.121.101.242 in both views and www.polodesalud.com.ar remains a CNAME to the apex. Its MX points to mail.intelisis.com.ar. The operator confirmed the existing route through Lujan PPPoE-in backbone-16 is correct; no further Polo change is required.
  - pms.polodesalud.com.ar returns NXDOMAIN in both views and has no External PTR following the approved retirement. pbx.aero.com.ar remains A 192.168.26.6 in Internal and is absent from External; no PBX destination NAT exists on the four audited CORE routers.
  - mantis.intelisis.com.ar is a CNAME to tic.intelisis.com.ar in both DNS views; its External target resolves to 138.121.101.15 and its Internal target resolves to 10.8.0.61. TIC forwards ports 20502/20503 to CT 27050; no Mantis forwarding was found on Lujan.
  - Mantis is a private-use application that intentionally remains reachable through the public network at TIC ports 20502/20503; the private audience is distinct from the public access path.
  - web.intelisis.com.ar and lujan.intelisis.com.ar are active shared workload endpoints on 138.121.100.15.
  - gestion.intelisis.com.ar is a CNAME to tic.intelisis.com.ar in both views; the TIC router A records are 10.8.0.61 Internal and 138.121.101.15 External. gestion.aero.com.ar is absent from both views.
  - db1.intelisis.com.ar is published through TIC at 138.121.101.15; legacy database.intelisis.com.ar and its former 138.121.101.4 PTR are retired. Source CT 25025 is deleted, no old :5432 NAT remains, and 138.121.101.4/32 has been removed from Lujan and withdrawn from all four CORE routers.
  - lujan.intelisis.com.ar, tic.intelisis.com.ar, centro.intelisis.com.ar, and cordoba.intelisis.com.ar identify the public addresses assigned to their respective CORE edge routers.
  - 138.121.101.2 has active Prestoprenda destination NAT but no A or PTR in the inspected External zones.
  - Operator direction October 15: Prestoprenda is externally resolved and administered, must retain its own public IP, and must not receive Internal DNS publication from this environment.
  - Operator direction October 15: keep Mailcow multi-tenant on its existing service/address, make mail.intelisis.com.ar the canonical host, and use CNAMEs for compatible service-host aliases. Keep each mail domain apex's MX/TXT records instead of making apexes CNAMEs; have MX point directly to the canonical mail host.
  - 45.238.8.15 now has an External A record for cordoba.intelisis.com.ar; other addresses in 45.238.8.0/22 were not audited here.
  - DNS absence is not evidence that an address is unallocated.
  - Operator direction October 15: S3 is private and is staged for high-port NAT; four TIC mappings remain planned and disabled. Ollama will use operator-selected 138.121.101.4, subject to address reactivation, route, TLS, and authentication verification; 138.121.101.3 remains assigned to IoT. Netmgr's External CNAME to lujan.intelisis.com.ar is already documented as published. LTS and groupware identities are deprecated; groupware.aero.com.ar retirement remains pending authoritative DNS execution and verification. DNS retirement does not authorize deleting LXC 25004.

