    public_native_protocol: Public protocol service; preserve its standard or protocol-required listener ports.
    restricted_admin: Trusted administrative access only; high-port translation may be considered after audience, client, and source-policy validation.
    internal_only: No public DNS or NAT publication is authorized.
    network_identity: Router or routed network identity, not a workload service endpoint.
    mixed_service_identity: Shared router address with separately managed services; classify each service independently.
    unresolved: Audience, ownership, activity, or endpoint is not sufficiently verified; do not migrate or activate.
    retired: Retired address or service; do not republish without approval.
