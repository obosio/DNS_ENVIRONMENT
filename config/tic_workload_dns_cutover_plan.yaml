metadata:
  version: 1
  updated_at: '2026-10-15'
  status: db1_internal_client_acceptance_passed_external_route_waived_source_deleted
  migration_state: db1_tls_deployed_all_internal_clients_verified_source_deleted
  live_changes_authorized: true
  description: >
    DNS record changes for the Database, Gestion, and Mantis TIC handoff.
    The Database DNS cutover is published in both views, and the canonical
    hostname was renamed from database.intelisis.com.ar to db1.intelisis.com.ar.
    Traccar, Node-RED, and CRM were switched to the new hostname. A valid
    production certificate for db1 was deployed to PostgreSQL and reloaded;
    target-local Certbot owns DNS-01 renewal and the PostgreSQL deployment
    hook. CRM remains on `sslmode=verify-full`, and its web route and all nine
    workers now pass internal acceptance. Traccar and Node-RED database
    acceptance also pass. The operator waived external-vantage testing, so
    public route reachability remains unverified. Source CT 25025 was deleted
    after cutover to reclaim storage and is no longer available for rollback.
    The intended next phase is a new PostgreSQL peer in CLUSTER-CORDOBA.
    Candidate VM `24025` was created as `db2.intelisis.com.ar` on
    `pve-upr-3-cor` with a 32 GiB OS disk and separate 512 GiB data/WAL disk.
    The October 14 live check found the guest network unreachable. The
    RouterOS PASSTHROUGH bridge already covered VLANs 25-27; VLAN 25 was
    missing only from the Córdoba switch PASSTHROUGH bridge VLAN table. After
    operator approval, it was added tagged on the router-facing and PVE-facing
    switch trunks. The operator then identified the subnet egress drop as old
    and requested its removal; this restored Debian mirror access. QEMU Guest
    Agent, the persistent PostgreSQL data disk, and pgEdge PostgreSQL 17.11
    with Spock 5.0.13/PostGIS 3.6.4 are now installed and verified. PostgreSQL
    listens only on localhost; the Spock extension is not created or
    preloaded, and replication remains inactive. TLS, DNS/client routing, and
    replication design/approval remain pending.
    Gestion's approval remains limited to its canonical hostname. Mantis's
    approved canonical CNAME cutover to TIC is live in both views. Its TIC
    HTTPS/SSH redirects are active and no Mantis forwarding remains on Lujan.
    An October 16 check from this workstation connected to public TIC HTTPS
    20502 and SSH 20503; HTTPS certificate validation passed and redirected to
    the Mantis login page, while SSH returned an OpenSSH banner. A subsequent
    authenticated web login using locally stored credentials reached the
    authenticated dashboard with TLS verification enabled; no issue or
    customer records were read or changed. The operator confirms the external
    firewall enforces ingress access control. The separately approved shared
    apex DNS targets were published and verified in both views on both
    authorities on October 14.

